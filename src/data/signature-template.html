<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @media (prefers-color-scheme: dark) {
    .sig-name { color: #f0f0f0 !important; }
    .sig-title { color: #666666 !important; }
    .sig-contact { color: #888888 !important; }
    .sig-logo-dark { display: none !important; }
    .sig-logo-light { display: block !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;">

<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; border-collapse: collapse;">
  <tr>
    <td height="20" style="padding: 0; mso-line-height-rule: exactly; line-height: 1;">
      <span class="sig-name" style="font-size: 15px; font-weight: 700; color: #111111; letter-spacing: -0.01em; line-height: 1;">{{NAME}}</span>
    </td>
  </tr>
  <tr>
    <td height="3" style="font-size: 0; line-height: 0; mso-line-height-rule: exactly;">&#8203;</td>
  </tr>
  <tr>
    <td height="14" style="padding: 0 0 8px 0; mso-line-height-rule: exactly; line-height: 1;">
      <span class="sig-title" style="font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #999999; line-height: 1;">{{TITLE}}</span>
    </td>
  </tr>
  <tr>
    <td style="padding: 0 0 8px 0;">
      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
        <tr>
          <td width="200" height="2" bgcolor="#1D9E75" style="font-size: 0; line-height: 0; mso-line-height-rule: exactly; height: 2px;">&#8203;</td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="padding: 0 0 0 8px;">
      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
        <tr>
          <td width="36" style="padding: 0 14px 0 0; vertical-align: middle;">
            <img class="sig-logo-dark"
              src="https://wecan.technology/c-mark-dark.png"
              width="36" height="36" alt="weCan" border="0"
              style="display:block;">
            <img class="sig-logo-light"
              src="https://wecan.technology/c-mark-light.png"
              width="36" height="36" alt="weCan" border="0"
              style="display:none;">
          </td>
          <td style="vertical-align: middle;">
            <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
              <tr>
                <td height="18" style="padding: 0; mso-line-height-rule: exactly; line-height: 18px;">
                  <a href="tel:{{PHONE_HREF}}" class="sig-contact" style="font-size: 11px; color: #666666; font-family: Arial, Helvetica, sans-serif; text-decoration: none; line-height: 1;">{{PHONE}}</a>
                </td>
              </tr>
              <tr>
                <td height="18" style="padding: 0; mso-line-height-rule: exactly; line-height: 18px;">
                  <a href="https://wecan.technology" class="sig-contact" style="font-size: 11px; color: #666666; font-family: Arial, Helvetica, sans-serif; text-decoration: none; line-height: 1;">wecan.technology</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="padding: 20px 0 0 0; max-width: 400px;">
      <p style="font-size: 9px; color: #bbbbbb; font-family: Arial, Helvetica, sans-serif; line-height: 1.6; margin: 0;">This email and any attachments are confidential and intended solely for the named recipient. If you have received this email in error please notify the sender and delete it.</p>
    </td>
  </tr>
</table>

</body>
</html>
